# custom config
CONFIG_APP_DEBUG=y
CONFIG_APP_DEBUG_BOOT=n
CONFIG_APP_DEBUG_LTE_CONNECTING=n
CONFIG_APP_DEBUG_CLOUD_CONNECTING=n
CONFIG_APP_DEBUG_LTE_LOCATION=n
CONFIG_APP_DEBUG_GNSS_ACQUIRE=n

# temporary avoid stack overflow
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# debug
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_AT_HOST_LIBRARY=n # expose AT-command with serial interface


# fallback
CONFIG_APP_MODEM_RSRP_RECOVERY_DBM=-100

# structure
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_ZBUS=y
CONFIG_SENSOR=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16
CONFIG_HEAP_MEM_POOL_SIZE=16384

# location
CONFIG_LOCATION=y
CONFIG_LOCATION_METHOD_CELLULAR=y
CONFIG_LOCATION_METHODS_LIST_SIZE=2
CONFIG_LOCATION_SERVICE_NRF_CLOUD=y

# cloud
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_MQTT=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=n
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
CONFIG_MODEM_JWT=y

# modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_CELLULAR_PROFILE_MODULE=y
CONFIG_AT_MONITOR_HEAP_SIZE=1024
CONFIG_NTN=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y

# for sending udp
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# sim setup (monogatari)
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="data.mono"


#testing
CONFIG_APP_CORE_SEND_UDP_DATA=n
CONFIG_APP_DEBUG_CORE_UDP_BURST_TEST=n
CONFIG_APP_DEBUG_NTN=n

#test LTE-Probe without breaking rest of the application
CONFIG_APP_CORE_SM_PROBE_TEST=n

#test
CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y

