
#----------------------------
# Custom Konfig
#----------------------------

CONFIG_APP_DEBUG=y
CONFIG_APP_DEBUG_BOOT=n
#CONFIG_APP_ENABLE_AGNSS
CONFIG_APP_DEBUG_LTE_CONNECTING=y

# ----------------------------
# Logging / debug
# ----------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# ----------------------------
# App framework
# ----------------------------
CONFIG_SMF=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# ----------------------------
# Modem / LTE / GNSS
# ----------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_CELLULAR_PROFILE_MODULE=y

# ----------------------------
# Location library
# ----------------------------
CONFIG_LOCATION=y

# ----------------------------
# Networking / sockets
# ----------------------------
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# ----------------------------
# SIM / PDN setup (Amarisoft)
# ----------------------------
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="default"

# ----------------------------
# nRF Cloud + CoAP + A-GNSS
# ----------------------------
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y

CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=64

# ----------------------------
# Explicitly disable NTN for this test phase
# ----------------------------
CONFIG_NTN=n